<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite | Kitchen Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-[#111827]/80 px-6 py-4 flex items-center justify-between sticky top-0 z-50 backdrop-blur">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 bg-orange-600 rounded-lg flex items-center justify-center font-bold text-white shadow-lg shadow-orange-600/30">
        QB
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight">Kitchen Operations Board</h1>
        <p class="text-xs text-slate-400">Live order queue synced with student checkout</p>
      </div>
    </div>
    
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 text-xs text-emerald-400 bg-emerald-950/60 border border-emerald-800/60 px-3 py-1.5 rounded-full">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Auto-sync: 3s</span>
      </div>
      <button onclick="fetchOrders()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition">
        Refresh Now
      </button>
      <a href="/index.html" class="text-xs text-slate-400 hover:text-slate-200 transition">Exit to App</a>
    </div>
  </header>

  <!-- Metrics Bar -->
  <section class="max-w-7xl mx-auto w-full px-6 py-6 grid grid-cols-1 sm:grid-cols-4 gap-4">
    <div class="bg-[#131c2e] border border-slate-800 rounded-xl p-4">
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pending Orders</span>
      <p id="metric-pending" class="text-2xl font-bold text-amber-400 mt-1">0</p>
    </div>
    <div class="bg-[#131c2e] border border-slate-800 rounded-xl p-4">
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Preparing</span>
      <p id="metric-preparing" class="text-2xl font-bold text-blue-400 mt-1">0</p>
    </div>
    <div class="bg-[#131c2e] border border-slate-800 rounded-xl p-4">
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Ready for Pickup</span>
      <p id="metric-ready" class="text-2xl font-bold text-emerald-400 mt-1">0</p>
    </div>
    <div class="bg-[#131c2e] border border-slate-800 rounded-xl p-4">
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Completed</span>
      <p id="metric-completed" class="text-2xl font-bold text-slate-400 mt-1">0</p>
    </div>
  </section>

  <!-- Orders Grid -->
  <main class="max-w-7xl mx-auto w-full px-6 pb-12 flex-1">
    <div id="orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <div id="empty-state" class="hidden text-center py-20">
      <div class="inline-flex p-4 rounded-full bg-slate-900 border border-slate-800 text-slate-500 mb-3">
        ✓
      </div>
      <h3 class="text-slate-300 font-semibold text-base">All Caught Up!</h3>
      <p class="text-slate-500 text-sm mt-1">No active orders in the queue right now.</p>
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:8080/api';
    let currentOrders = [];

    async function fetchOrders() {
      try {
       const res = await fetch('/api/orders');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const orders = await res.json();
      currentOrders = Array.isArray(orders) ? orders : [];
      renderOrders();
      updateMetrics();
      } catch (err) {
        console.error('Failed to poll orders:', err);
      }
    }

    function renderOrders() {
      const container = document.getElementById('orders-container');
      const emptyState = document.getElementById('empty-state');
      const activeTickets = currentOrders.filter(o => o.status !== 'COMPLETED' && o.status !== 'CANCELLED');

      if (activeTickets.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      container.innerHTML = activeTickets.map(order => {
        const token = order.id ? ('TK-' + order.id) : (order.token || 'N/A');
        const badgeColor = getStatusBadge(order.status);

        return `
          <div class="bg-[#131c2e] border border-slate-800 rounded-xl p-5 shadow-lg flex flex-col justify-between transition hover:border-slate-700">
            <div>
              <div class="flex items-start justify-between mb-3 border-b border-slate-800/70 pb-3">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-mono text-sm font-bold text-orange-400">${token}</span>
                  </div>
                  <p class="text-xs text-slate-400 mt-1">Slot: ${order.pickupSlotId || '12:00 PM'}</p>
                </div>
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${badgeColor}">
                  ${order.status}
                </span>
              </div>

              <div class="mb-4 text-xs text-slate-300">
                <span>Total Amount: </span>
                <span class="font-mono font-bold text-emerald-400">₹${order.totalPrice || 0}</span>
              </div>
            </div>

            <div class="pt-3 border-t border-slate-800 flex flex-wrap gap-2">
              ${order.status === 'PENDING' ? `
                <button onclick="updateStatus('${token}', 'PREPARING')"
                        class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2 px-3 rounded-lg transition">
                  Start Preparing
                </button>
              ` : ''}

              ${order.status === 'PREPARING' ? `
                <button onclick="updateStatus('${token}', 'READY_FOR_PICKUP')"
                        class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2 px-3 rounded-lg transition">
                  Mark Ready
                </button>
              ` : ''}

              ${order.status === 'READY_FOR_PICKUP' ? `
                <button onclick="updateStatus('${token}', 'COMPLETED')"
                        class="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold py-2 px-3 rounded-lg transition">
                  Handed Over
                </button>
              ` : ''}

              <button onclick="updateStatus('${token}', 'CANCELLED')"
                      class="text-xs text-rose-400 hover:text-rose-300 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-900/60 py-2 px-2.5 rounded-lg transition">
                Cancel
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateStatus(token, newStatus) {
    try {
      const res = await fetch('/api/orders/' + token + '/status', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      if (!res.ok) throw new Error('Status update failed: ' + res.status);
      fetchOrders();
    } catch (err) {
      alert('Could not update order status: ' + err.message);
    }
  }

    function getStatusBadge(status) {
      switch (status) {
        case 'PENDING': return 'bg-amber-950/70 text-amber-400 border border-amber-800/60';
        case 'PREPARING': return 'bg-blue-950/70 text-blue-400 border border-blue-800/60';
        case 'READY_FOR_PICKUP': return 'bg-emerald-950/70 text-emerald-400 border border-emerald-800/60';
        case 'COMPLETED': return 'bg-slate-800 text-slate-400 border border-slate-700';
        case 'CANCELLED': return 'bg-rose-950/70 text-rose-400 border border-rose-800/60';
        default: return 'bg-slate-800 text-slate-300';
      }
    }

    function updateMetrics() {
      document.getElementById('metric-pending').innerText = currentOrders.filter(o => o.status === 'PENDING').length;
      document.getElementById('metric-preparing').innerText = currentOrders.filter(o => o.status === 'PREPARING').length;
      document.getElementById('metric-ready').innerText = currentOrders.filter(o => o.status === 'READY_FOR_PICKUP').length;
      document.getElementById('metric-completed').innerText = currentOrders.filter(o => o.status === 'COMPLETED').length;
    }

    fetchOrders();
    setInterval(fetchOrders, 3000);
  </script>
</body>
</html>
